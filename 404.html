<!DOCTYPE html>
<html lang="mr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पृष्ठ सापडले नाही | श्रद्धांजलि बॅनर</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#3a0130">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="assets/daisyui.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&amp;family=Tiro+Devanagari+Marathi&amp;display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root, [data-theme] { background-color: #07000c; color: #fff5ee; }
    body {
        background:
            radial-gradient(ellipse 90% 55% at 50% -5%, rgba(70,1,55,0.55) 0%, transparent 65%),
            #07000c;
        font-family: 'Tiro Devanagari Marathi', serif;
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 2rem 1.25rem; text-align: center;
    }
    .wrap { max-width: 30rem; }
    .mantra { color: #c9a06a; letter-spacing: 0.55em; margin-bottom: 1rem; }
    h1 {
        font-family: 'Rozha One', serif;
        font-size: clamp(2.4rem, 9vw, 4rem);
        color: #fff5ee; line-height: 1.1; margin-bottom: 0.5rem;
    }
    .divider {
        width: 160px; height: 1px; margin: 1.1rem auto;
        background: linear-gradient(90deg, transparent, #f0cc88, transparent);
    }
    p { color: rgba(255,240,220,0.72); line-height: 1.6; margin-bottom: 1.75rem; }
    .home-link {
        display: inline-block; padding: 0.75rem 1.6rem;
        background: #460137; color: #fff5ee;
        border-radius: 10px; text-decoration: none; font-weight: 700;
        box-shadow: 0 4px 16px rgba(70,1,55,0.4);
        transition: background 0.2s, transform 0.15s;
    }
    .home-link:hover { background: #6a0249; transform: translateY(-2px); }
    .home-link:focus-visible { outline: 3px solid #894dce; outline-offset: 3px; }
</style>
</head>
<body>
    <main class="wrap">
        <div class="mantra" aria-hidden="true">॥ श्री ॥</div>
        <h1>404</h1>
        <div class="divider" aria-hidden="true"></div>
        <p>
            हे पृष्ठ सापडले नाही.<br>
            The page you were looking for could not be found.
        </p>
        <a class="home-link" href="/">मुख्यपृष्ठावर जा · Go to homepage</a>
    </main>
</body>
</html>
