name: Security Scan

# Coverage map for this repository:
#   secrets in history ............ gitleaks (below)
#   dependency CVEs ............... npm audit (below)
#   shipped JS/HTML analysis ...... CodeQL *default setup*, configured in
#                                   repo Settings > Code security. There is
#                                   deliberately no CodeQL job here: GitHub
#                                   rejects SARIF from an advanced workflow
#                                   while default setup is enabled
#                                   ("CodeQL analyses from advanced
#                                   configurations cannot be processed when
#                                   the default setup is enabled").
#   third-party script integrity .. web-hardening (below)
#   response headers .............. web-hardening (below)
#   container base image .......... hadolint, in docker-publish.yml
#
# Not enabled: actions/dependency-review-action. It requires the repository's
# Dependency Graph to be turned on (Settings > Code security > Dependency
# graph) and fails hard otherwise. Turn that on and this is worth adding back;
# until then npm audit covers the same ground for our (dev-only) tree.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly re-scan so newly disclosed CVEs surface without a push.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets & Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches entire history so Gitleaks can perform a deep scan of commits

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Every dependency here is build tooling — none of it reaches a visitor's
      # browser — but a compromised build dependency can still poison the
      # committed CSS, so this stays blocking at high and above.
      - run: npm audit --audit-level=high

  pinned-versions:
    name: Pinned major versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # daisyUI 5 and Tailwind 4 express colours as oklch() throughout.
      # html2canvas 1.4.1 cannot parse oklch(), so a major bump would silently
      # start exporting black banners — the one bug a user could not work
      # around. Fail loudly if someone (or Dependabot) bumps past the major.
      - name: Guard daisyUI and Tailwind majors
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const pins = { daisyui: '4', tailwindcss: '3' };
          let fail = 0;
          for (const [name, major] of Object.entries(pins)) {
            const range = pkg.devDependencies[name] || '';
            if (!range.replace(/^[^\d]*/, '').startsWith(major + '.')) {
              console.log(`::error::${name} must stay on ${major}.x (html2canvas cannot parse oklch()); found "${range}"`);
              fail = 1;
            } else {
              console.log(`${name} pinned to ${major}.x — OK (${range})`);
            }
          }
          process.exit(fail);
          NODE

  web-hardening:
    name: Third-party & Header Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # grep cannot see tags that span lines, so parse the markup instead —
      # a multi-line <script> tag would otherwise slip through unchecked.
      - name: Require SRI, safe external links and security headers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let fail = 0;
          const html = fs.readFileSync('index.html', 'utf8');

          // 1. Remote scripts must be integrity-pinned. A compromised CDN would
          //    otherwise run arbitrary code while families type names and
          //    upload photographs. gtag.js is generated per request and has no
          //    stable hash, so it is exempt by necessity — any NEW exemption
          //    belongs here with a justification.
          const EXEMPT = [/googletagmanager\.com/];
          for (const tag of html.match(/<script\b[^>]*>/gs) || []) {
            if (!/src\s*=\s*"https:/.test(tag)) continue;
            if (EXEMPT.some((re) => re.test(tag))) {
              console.log('SRI skipped (no stable hash): gtag.js');
              continue;
            }
            if (!/integrity\s*=/.test(tag) || !/crossorigin/.test(tag)) {
              console.log(`::error::Remote script without integrity+crossorigin: ${tag.slice(0, 120)}`);
              fail = 1;
            } else {
              console.log('SRI present:', (tag.match(/src="([^"]+)"/) || [])[1]);
            }
          }

          // 2. target=_blank without rel=noopener hands the opener window to
          //    the destination page (reverse tabnabbing).
          for (const tag of html.match(/<a\b[^>]*>/gs) || []) {
            if (/target\s*=\s*"_blank"/.test(tag) && !/noopener/.test(tag)) {
              console.log(`::error::target=_blank without rel=noopener: ${tag.slice(0, 120)}`);
              fail = 1;
            }
          }
          console.log('External links checked.');

          // 3. Required response headers must be declared for Netlify.
          const headers = fs.readFileSync('_headers', 'utf8');
          for (const h of ['X-Content-Type-Options', 'X-Frame-Options', 'Referrer-Policy',
                           'Content-Security-Policy', 'Permissions-Policy']) {
            if (!headers.includes(h)) {
              console.log(`::error::_headers missing ${h}`);
              fail = 1;
            }
          }
          console.log('Security headers checked.');

          process.exit(fail);
          NODE

  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      # Uploading requires code scanning to be available on the repo; do not
      # fail the run if it is not.
      - name: Upload results
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
